<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Maqam World - Arabic Music Theory Guide</title>
  <meta name="description" content="Foundations of Arabic Music Theory - A Violin-Oriented Guide">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
  <style>
    .maqam-score {
      margin: 1rem 0;
      padding: 0.5rem;
      border: 1px solid var(--border-color, #e0e0e0);
      border-radius: 6px;
      
    }
    .maqam-score:empty::before {
      content: 'Loading score…';
      color: #700808;
      font-size: 0.85em;
    }
  </style>
</head>
<body>

  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Maqam World',
      repo: 'https://github.com/langisor/maqamworld',
      loadNavbar: true,
      loadSidebar: true,
      coverpage: true,
      maxLevel: 4,
      subMaxLevel: 3,
      autoHeader: true,
      relativePath: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Type to search',
        noData: 'No Results!',
        depth: 6,
      },
      copyCode: {
        buttonText: 'Copy to clipboard',
        errorText: 'Error',
        successText: 'Copied',
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true,
      },

      // Renders any <div class="maqam-score" data-src="..."></div> found on
      // the current page after docsify injects it into the DOM. Runs on
      // every page navigation (level-1.md, level-2.md, appendix, etc.),
      // so a page only needs the <div> marker - no per-page <script> needed
      // (script tags inside markdown content are not executed by docsify).
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            document.querySelectorAll('.maqam-score:not([data-rendered])').forEach(function (el) {
              var src = el.getAttribute('data-src');
              if (!src) return;
              el.setAttribute('data-rendered', 'true'); // avoid double-render on repeat visits
              var osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(el, {
                autoResize: true,
                drawTitle: true
              });
              osmd.load(src).then(function () {
                osmd.render();
              }).catch(function (err) {
                el.textContent = 'Could not load ' + src + ': ' + err;
              });
            });
          });
        }
      ],

    }
  </script>
<!-- OSMD - render Musicxml files (must load before docsify core, below) -->
<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.6/build/opensheetmusicdisplay.min.js"></script>
  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
  <!-- Search plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/lib/plugins/search.min.js"></script>
  <!-- Copy code plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <!-- Pagination plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
</body>
</html>
