<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Maqam World - Arabic Music Theory Guide</title>
  <meta name="description" content="Foundations of Arabic Music Theory - A Violin-Oriented Guide">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
</head>
<body>

  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Maqam World',
      repo: 'https://github.com/langisor/maqamworld',
      loadNavbar: true,
      loadSidebar: true,
      coverpage: true,
      maxLevel: 4,
      subMaxLevel: 3,
      autoHeader: true,
      relativePath: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Type to search',
        noData: 'No Results!',
        depth: 6,
      },
      copyCode: {
        buttonText: 'Copy to clipboard',
        errorText: 'Error',
        successText: 'Copied',
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true,
      },
      


    }
  </script>
<!-- OSMD - render Musicxml files -->
<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.6/build/opensheetmusicdisplay.min.js"></script>
  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
  <!-- Search plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/lib/plugins/search.min.js"></script>
  <!-- Copy code plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <!-- Pagination plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
</body>
</html>
